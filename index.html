<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Gør at browserfanen ligner Google Drive som camouflage -->
  <link rel="icon" type="image/png" href="https://gstatic.com">
  <title>Google Drev - Mit drev</title>

  <style>
    :root {
      --bg: #170227;
      --panel: #2d074b;
      --purple: #7f4dff;
      --pink: #ff4eae;
      --yellow: #ffd84d;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% 0%, #6634a1 0, transparent 32rem),
        linear-gradient(135deg, #12001f, var(--bg));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 5%;
      background: rgba(20, 1, 35, .9);
      border-bottom: 1px solid #ffffff22;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .logo span { color: var(--yellow); }

    #search {
      width: min(500px, 100%);
      margin-left: auto;
      padding: 12px 17px;
      border: 0;
      border-radius: 99px;
      outline: none;
      font-size: 1rem;
    }

    main {
      width: min(1400px, 92%);
      margin: 35px auto;
    }

    .hero {
      padding: 35px;
      border-radius: 24px;
      background: linear-gradient(120deg, #7545ef, #e8379d);
      box-shadow: 0 15px 40px #0007;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
    }

    .hero p {
      margin: 12px 0 0;
      font-size: 1.1rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0;
    }

    .filter {
      cursor: pointer;
      padding: 10px 16px;
      border: 1px solid #ffffff44;
      border-radius: 99px;
      color: white;
      background: #ffffff16;
      font-weight: bold;
      outline: none;
    }

    .filter:hover, .filter.active {
      color: #250438;
      border-color: var(--yellow);
      background: var(--yellow);
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 16px;
    }

    .game {
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 16px;
      text-align: left;
      color: #1c0b28;
      background: white;
      box-shadow: 0 8px 20px #0006;
      font-family: inherit;
      transition: transform .18s, box-shadow .18s;
      width: 100%;
    }

    .game:hover {
      transform: translateY(-7px) scale(1.02);
      box-shadow: 0 17px 30px #0009;
    }

    .art {
      display: grid;
      place-items: center;
      height: 125px;
      font-size: 4.3rem;
    }

    .game-info {
      padding: 12px;
    }

    .game-name {
      display: block;
      font-size: 1rem;
      font-weight: 900;
    }

    .game-type {
      display: block;
      margin-top: 5px;
      color: #6f5b79;
      font-size: .78rem;
    }

    #empty {
      display: none;
      padding: 40px;
      text-align: center;
      font-size: 1.2rem;
    }

    /* Game player panel */
    #player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 18px;
      background: #11001e;
    }

    #player.open {
      display: flex;
      flex-direction: column;
    }

    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 48px;
      padding-bottom: 14px;
    }

    .player-bar h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .back-button {
      cursor: pointer;
      padding: 10px 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--pink);
      font-weight: bold;
    }

    #game-area {
      display: grid;
      flex: 1;
      place-items: center;
      overflow: auto;
      border-radius: 18px;
      background: radial-gradient(circle at top, #47216c, #1a0629 75%);
    }

    /* Stylling af iframe så spillet fylder hele boksen ud */
    iframe {
      width: 100%;
      height: 100%;
      min-height: 75vh;
      border: 4px solid #ffffff25;
      border-radius: 12px;
      background: #0a1020;
    }

    footer {
      padding: 35px;
      color: #dac9e8;
      text-align: center;
    }

    @media (max-width: 600px) {
      header { flex-wrap: wrap; }
      #search { order: 3; margin-left: 0; }
      .hero { padding: 26px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">🎮 ELLIO <span>GAMES</span></div>
    <input id="search" type="search" placeholder="Search your games...">
  </header>

  <main>
    <section class="hero">
      <h1>Choose. Play. Win.</h1>
      <p>All games are built into Ellio Games and stay on this website.</p>
    </section>

    <div class="filters">
      <button class="filter active" data-category="All">All games</button>
      <button class="filter" data-category="Arcade">Arcade</button>
      <button class="filter" data-category="Action">Action</button>
    </div>

    <section class="games" id="games"></section>
    <p id="empty">No game found. Try another search.</p>
  </main>

  <section id="player">
    <div class="player-bar">
      <h2 id="player-title">Now Playing</h2>
      <button class="back-button" onclick="closeGame()">✕ Back to menu</button>
    </div>
    <div id="game-area"></div>
  </section>

  <footer>© 2026 Ellio Games</footer>

  <script>
    // 💡 Her tilføjer du bare dine CrazyGames links under 'url'
    const gameList = [
      { name: "Veck.io", icon: "🎯", category: "Action", url: "https://crazygames.com" },
      { name: "Retro Snake", icon: "🐍", category: "Arcade", url: "https://enclavegames.com" },
      { name: "Tetris Arcade", icon: "🧱", category: "Arcade", url: "https://enclavegames.com" },
      { name: "Flappy Bird", icon: "🐦", category: "Arcade", url: "https://enclavegames.com" }
    ];

    const colours = [
      ["#20c971", "#0b8ac9"],
      ["#fa3c7f", "#893de8"],
      ["#ff9b2f", "#ff4664"],
      ["#2765e8", "#45d8bb"]
    ];

    const gamesElement = document.getElementById("games");
    const search = document.getElementById("search");
    const emptyMessage = document.getElementById("empty");
    let selectedCategory = "All";

    // Viser spillene på skærmen baseret på søgning og kategorier
    function showGames() {
      const query = search.value.toLowerCase();
      gamesElement.innerHTML = "";

      const visibleGames = gameList.filter(game =>
        (selectedCategory === "All" || game.category === selectedCategory) &&
        game.name.toLowerCase().includes(query)
      );

      if (visibleGames.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
      }

      visibleGames.forEach((game, index) => {
        const button = document.createElement("button");
        button.className = "game";
        
        // Vælg en farvekombination til baggrunden
        const col = colours[index % colours.length];
        
        button.innerHTML = `
          <div class="art" style="background: linear-gradient(135deg, ${col[0]}, ${col[1]})">${game.icon}</div>
          <div class="game-info">
            <span class="game-name">${game.name}</span>
            <span class="game-type">${game.category}</span>
          </div>
        `;

        button.onclick = () => openGame(game);
        gamesElement.appendChild(button);
      });
    }

    // Åbner spillet i din fuldskærmsmenu
    function openGame(game) {
      document.getElementById("player-title").innerText = "Now Playing: " + game.name;
      
      // Her bygger vi iframen med sandbox, så spillet SKAL blive på din side!
      document.getElementById("game-area").innerHTML = `
        <iframe src="${game.url}" sandbox="allow-scripts allow-same-origin"></iframe>
      `;
      
      document.getElementById("player").classList.add("open");
    }

    // Lukker spillet og rydder op
    function closeGame() {
      document.getElementById("game-area").innerHTML = "";
      document.getElementById("player").classList.remove("open");
    }

    // Lyt efter klik på kategoriknapperne
    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".filter").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedCategory = e.target.getAttribute("data-category");
        showGames();
      });
    });

    // Lyt efter indtastning i søgefeltet
    search.addEventListener("input", showGames);

    // Kør funktionen første gang siden loades
    showGames();
  </script>
</body>
</html>
